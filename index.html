<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindustan Digital Market — Har cheez, premium andaaz mein</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#14110F;
  --ivory:#F7F2E7;
  --gold:#C9A227;
  --gold-deep:#A9840F;
  --maroon:#6B1E2B;
  --forest:#1F4B3F;
  --charcoal:#211E1A;
  --line:#E4DBC5;
  --card:#FFFFFF;
  --muted:#847C6A;
  --radius:2px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ivory);
  color:var(--charcoal);
  font-family:'Work Sans',sans-serif;
  line-height:1.55;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  color:var(--ink);
  margin:0;
  font-weight:600;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.container{max-width:1140px;margin:0 auto;padding:0 20px;}

/* ---------- Header ---------- */
header.site{background:var(--ink);color:#fff;position:sticky;top:0;z-index:60;
  border-bottom:2px solid var(--gold);}
.topbar{display:flex;align-items:center;gap:20px;padding:14px 20px;max-width:1140px;margin:0 auto;}
.logo{display:flex;flex-direction:column;line-height:1.05;white-space:nowrap;}
.logo .l1{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:600;color:var(--gold);letter-spacing:.3px;}
.logo .l2{font-size:.62rem;letter-spacing:2.5px;color:#C9C2AE;margin-top:2px;}
.searchwrap{flex:1;display:flex;max-width:640px;}
.searchwrap input{flex:1;border:none;padding:11px 14px;font-size:.95rem;border-radius:var(--radius) 0 0 var(--radius);}
.searchwrap button{background:var(--gold);border:none;padding:0 20px;border-radius:0 var(--radius) var(--radius) 0;color:var(--ink);font-weight:600;}
.navicons{display:flex;align-items:center;gap:22px;font-size:.85rem;white-space:nowrap;}
.navicons a{display:flex;flex-direction:column;gap:2px;position:relative;}
.navicons small{color:#B9B2A0;font-size:.68rem;}
.badge{position:absolute;top:-8px;right:-14px;background:var(--maroon);color:#fff;font-size:.65rem;padding:1px 6px;border-radius:20px;font-weight:600;}
.subnav{background:#221E1A;display:flex;gap:20px;padding:9px 20px;overflow-x:auto;font-size:.85rem;}
.subnav a{white-space:nowrap;color:#D9D2BE;}
.subnav a:hover{color:var(--gold);}

/* ---------- Buttons ---------- */
.btn{display:inline-block;padding:11px 20px;border-radius:var(--radius);border:1px solid transparent;font-weight:600;font-size:.9rem;}
.btn-primary{background:var(--gold);color:var(--ink);}
.btn-primary:hover{background:var(--gold-deep);}
.btn-outline{background:transparent;border-color:var(--ink);color:var(--ink);}
.btn-outline:hover{background:var(--ink);color:#fff;}
.btn-maroon{background:var(--maroon);color:#fff;}
.btn-maroon:hover{background:#571724;}
.btn-forest{background:var(--forest);color:#fff;}
.btn-block{width:100%;text-align:center;}
.btn-sm{padding:7px 13px;font-size:.8rem;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--charcoal);}

/* ---------- Layout blocks ---------- */
.stall{border:1px solid var(--line);background:var(--card);padding:22px;margin-bottom:18px;border-radius:var(--radius);}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;border-bottom:2px solid var(--ink);padding-bottom:8px;}
.section-head h2{font-size:1.3rem;}
.section-head a{font-size:.85rem;color:var(--forest);font-weight:600;}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:0;border:1px solid var(--line);background:var(--card);overflow:hidden;margin-bottom:18px;}
.hero-copy{padding:44px 38px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
.hero-copy h1{font-size:2.5rem;line-height:1.1;}
.hero-copy p{color:var(--muted);max-width:40ch;}
.hero-visual{background:linear-gradient(160deg,var(--maroon),#3A0F17);display:flex;align-items:center;justify-content:center;color:var(--gold);padding:30px;font-family:'Fraunces',serif;font-size:1.15rem;text-align:center;}

.chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip{border:1px solid var(--line);padding:7px 14px;border-radius:20px;font-size:.85rem;background:#fff;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
.pcard{border:1px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .15s,border-color .15s;}
.pcard:hover{border-color:var(--gold);box-shadow:0 4px 18px rgba(20,17,15,.08);}
.pcard .thumb{height:130px;background:#F1EAD8;display:flex;align-items:center;justify-content:center;font-size:2.4rem;border-radius:var(--radius);}
.pcard h3{font-size:.92rem;font-weight:500;font-family:'Work Sans';color:var(--charcoal);min-height:2.6em;}
.price{font-weight:700;color:var(--ink);font-size:1.05rem;}
.price .mrp{font-weight:400;color:var(--muted);text-decoration:line-through;font-size:.8rem;margin-left:6px;}
.price .off{color:var(--forest);font-size:.8rem;font-weight:600;margin-left:6px;}
.rating{font-size:.78rem;color:var(--muted);}
.rating b{background:var(--forest);color:#fff;padding:1px 6px;border-radius:3px;margin-right:5px;}
.tag{position:absolute;top:10px;left:10px;background:var(--maroon);color:#fff;font-size:.68rem;padding:2px 8px;border-radius:2px;font-weight:600;}
.tag.prime{background:var(--forest);}
.tag.gold{background:var(--gold);color:var(--ink);}

/* ---------- Filters/listing ---------- */
.listing{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start;}
.filters{border:1px solid var(--line);background:var(--card);padding:18px;position:sticky;top:128px;}
.filters h4{font-size:.85rem;margin:14px 0 8px;color:var(--ink);}
.filters h4:first-child{margin-top:0;}
.filters label{display:flex;gap:8px;align-items:center;font-size:.85rem;margin-bottom:7px;color:var(--charcoal);}
.sortbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.85rem;}
.sortbar select{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);}

/* ---------- Product page ---------- */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:34px;}
.pdp-gallery .main{height:340px;background:#F1EAD8;display:flex;align-items:center;justify-content:center;font-size:5rem;border:1px solid var(--line);}
.pdp-thumbs{display:flex;gap:8px;margin-top:10px;}
.pdp-thumbs div{width:56px;height:56px;background:#F1EAD8;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.pdp-info h1{font-size:1.55rem;margin-bottom:6px;}
.pdp-info .brand{color:var(--forest);font-weight:600;font-size:.85rem;}
.pdp-price-block{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:16px 0;}
.pdp-price-block .price{font-size:1.75rem;}
.stock-ok{color:var(--forest);font-weight:600;font-size:.85rem;}
.variant-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.qty{display:inline-flex;border:1px solid var(--line);}
.qty button{border:none;background:#fff;width:34px;height:34px;font-size:1rem;}
.qty span{width:34px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);border-right:1px solid var(--line);}
.pdp-actions{display:flex;gap:12px;margin:18px 0;flex-wrap:wrap;}
.deliverybox{border:1px solid var(--line);padding:14px;font-size:.85rem;margin-top:10px;}
.deliverybox input{padding:6px 10px;border:1px solid var(--line);margin-right:8px;}
.emi-box{border:1px dashed var(--gold-deep);background:#FBF6E8;padding:12px 14px;margin-top:12px;font-size:.85rem;}
.emi-box select{margin-left:6px;}
.subscribe-box{border:1px solid var(--line);padding:12px 14px;margin-top:10px;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;}

.review{border-bottom:1px solid var(--line);padding:14px 0;}
.review:last-child{border-bottom:none;}
.review .rname{font-weight:600;font-size:.88rem;}
.review .stars{color:var(--gold-deep);font-size:.85rem;}

/* ---------- Cart ---------- */
.cart-row{display:grid;grid-template-columns:70px 1fr auto auto;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:16px 0;}
.cart-row .thumb{width:64px;height:64px;background:#F1EAD8;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.cart-summary{border:1px solid var(--line);background:var(--card);padding:20px;}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem;}
.summary-row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:700;font-size:1.05rem;}
.coupon-ok{color:var(--forest);font-size:.8rem;margin-top:6px;font-weight:600;}
.coupon-bad{color:var(--maroon);font-size:.8rem;margin-top:6px;font-weight:600;}

/* ---------- Checkout ---------- */
.checkout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}
.addr-card{border:1px solid var(--line);padding:14px;margin-bottom:10px;border-radius:var(--radius);cursor:pointer;}
.addr-card.selected{border-color:var(--forest);background:#F0F6F3;}
.pay-option{border:1px solid var(--line);padding:14px;margin-bottom:10px;border-radius:var(--radius);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.pay-option.selected{border-color:var(--gold-deep);background:#FBF6E8;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input,textarea,select{font-family:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);width:100%;font-size:.9rem;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;}

/* ---------- Orders ---------- */
.order-card{border:1px solid var(--line);background:var(--card);padding:18px;margin-bottom:14px;}
.order-head{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;}
.timeline{display:flex;gap:0;margin-top:14px;}
.tl-step{flex:1;text-align:center;font-size:.72rem;position:relative;color:var(--muted);}
.tl-step .dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin:0 auto 6px;}
.tl-step.done .dot{background:var(--forest);}
.tl-step.done{color:var(--forest);font-weight:600;}
.tl-step:not(:last-child)::after{content:'';position:absolute;top:5px;left:56%;width:88%;height:2px;background:var(--line);}
.tl-step.done:not(:last-child)::after{background:var(--forest);}

/* ---------- Seller dashboard ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.stat{border:1px solid var(--line);background:var(--card);padding:16px;}
.stat .num{font-family:'Fraunces';font-size:1.6rem;color:var(--ink);}
.stat .lbl{font-size:.78rem;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:600;font-size:.78rem;}
.pill{padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}
.pill.processing{background:#FBF0D8;color:var(--gold-deep);}
.pill.shipped{background:#E4EDEA;color:#2E5F53;}
.pill.delivered{background:#DEEFE6;color:var(--forest);}
.pill.active{background:#DEEFE6;color:var(--forest);}
.pill.running{background:#E4EDEA;color:var(--forest);}
.pill.paused{background:#F1EAD8;color:var(--muted);}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:16px;flex-wrap:wrap;}
.tabs button{padding:9px 16px;border:none;background:transparent;font-weight:600;font-size:.85rem;color:var(--muted);}
.tabs button.active{color:var(--ink);border-bottom:3px solid var(--gold);margin-bottom:-2px;}

/* ---------- Gift Cards & Referral ---------- */
.giftcard-visual{background:linear-gradient(135deg,var(--maroon),#3A0F17);color:var(--gold);padding:26px;border-radius:6px;font-family:'Fraunces',serif;font-size:1.1rem;display:flex;flex-direction:column;justify-content:space-between;height:150px;}
.refer-box{border:1px dashed var(--gold-deep);background:#FBF6E8;padding:18px;text-align:center;}
.refer-code{font-family:'Fraunces';font-size:1.4rem;letter-spacing:3px;color:var(--maroon);margin:10px 0;}

/* ---------- Chat widget ---------- */
.chat-fab{position:fixed;bottom:24px;right:24px;background:var(--maroon);color:#fff;width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:80;border:none;}
.chat-panel{position:fixed;bottom:90px;right:24px;width:300px;max-height:400px;background:#fff;border:1px solid var(--line);
  border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:80;display:none;flex-direction:column;overflow:hidden;}
.chat-panel.open{display:flex;}
.chat-head{background:var(--ink);color:var(--gold);padding:12px 16px;font-weight:600;font-size:.9rem;}
.chat-body{flex:1;padding:14px;font-size:.85rem;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.chat-msg{background:#F1EAD8;padding:8px 12px;border-radius:8px;max-width:85%;}
.chat-msg.user{background:var(--gold);align-self:flex-end;}
.chat-input{display:flex;border-top:1px solid var(--line);}
.chat-input input{border:none;flex:1;padding:10px;}
.chat-input button{border:none;background:var(--maroon);color:#fff;padding:0 14px;}

/* ---------- Notification dropdown ---------- */
.notif-wrap{position:relative;}
.notif-panel{position:absolute;top:36px;right:0;width:280px;background:#fff;color:var(--charcoal);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;z-index:70;border-radius:4px;}
.notif-panel.open{display:block;}
.notif-item{padding:11px 14px;border-bottom:1px solid var(--line);font-size:.82rem;}
.notif-item small{color:var(--muted);display:block;margin-top:2px;}

/* ---------- Misc ---------- */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold);padding:12px 22px;
  border-radius:var(--radius);font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;border:1px solid var(--gold-deep);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
footer{background:var(--ink);color:#C9C2AE;padding:34px 20px;margin-top:40px;font-size:.85rem;}
footer .container{display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between;}
footer h5{color:var(--gold);font-size:.85rem;margin-bottom:10px;}
footer div p{margin:5px 0;color:#A69F8C;cursor:pointer;}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,17,15,.5);display:none;align-items:center;justify-content:center;z-index:90;}
.modal-backdrop.open{display:flex;}
.modal{background:#fff;padding:26px;border-radius:6px;width:360px;max-width:90vw;}
.modal h3{margin-bottom:12px;}

@media(max-width:760px){
  .hero{grid-template-columns:1fr;}
  .pdp{grid-template-columns:1fr;}
  .listing{grid-template-columns:1fr;}
  .filters{position:static;}
  .checkout{grid-template-columns:1fr;}
  .cart-row{grid-template-columns:56px 1fr;}
  .topbar{flex-wrap:wrap;}
  .searchwrap{order:3;max-width:100%;width:100%;}
  .chat-panel{width:88vw;right:6vw;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<button class="chat-fab" onclick="toggleChat()">💬</button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">Hindustan Digital Market Support</div>
  <div class="chat-body" id="chatBody">
    <div class="chat-msg">Namaste! Main aapki kaise madad kar sakta hoon?</div>
  </div>
  <div class="chat-input">
    <input id="chatInput" placeholder="Apna sawaal likhein..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">Bhejein</button>
  </div>
</div>

<div class="modal-backdrop" id="returnModal">
  <div class="modal">
    <h3>Return / Replace Request</h3>
    <div class="field"><label>Reason</label>
      <select id="returnReason">
        <option>Item damaged ya defective hai</option>
        <option>Galat item mila</option>
        <option>Size/fit sahi nahi hai</option>
        <option>Quality expectation ke hisaab se nahi</option>
        <option>Ab item nahi chahiye</option>
      </select>
    </div>
    <div class="field"><label>Comments (optional)</label><textarea rows="2" id="returnComments"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-primary btn-sm" onclick="submitReturn()">Request bhejein</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal('returnModal')">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ===================== DATA ===================== */
const CATS = ["Electronics","Fashion","Home & Kitchen","Grocery","Books","Beauty"];
const COUPONS = {"SAVE10":{type:"pct",value:10},"FLAT100":{type:"flat",value:100},"WELCOME50":{type:"flat",value:50}};

const PRODUCTS = [
  {id:"p1",title:"Noise-Cancelling Wireless Headphones, 40hr Battery",cat:"Electronics",price:2999,mrp:5999,rating:4.3,ratings:12480,emoji:"🎧",brand:"SonicWave",badge:"Premium Choice",desc:"Over-ear wireless headphones with active noise cancellation, 40 hour battery life and quick charge support.",variants:["Black","Blue","White"],subscribable:false},
  {id:"p2",title:"Men's Cotton Regular Fit Casual Shirt",cat:"Fashion",price:699,mrp:1499,rating:4.1,ratings:3210,emoji:"👔",brand:"Urban Thread",badge:"Best Seller",desc:"100% cotton breathable fabric, regular fit, machine washable.",variants:["S","M","L","XL","XXL"],subscribable:false},
  {id:"p3",title:"Non-Stick Induction Base Cookware Set (5 Pcs)",cat:"Home & Kitchen",price:1849,mrp:3200,rating:4.5,ratings:8790,emoji:"🍳",brand:"HomeCraft",badge:"Premium",variants:["Standard"],desc:"5-piece non-stick cookware set, induction compatible, PFOA free coating.",subscribable:false},
  {id:"p4",title:"Organic Basmati Rice, 5kg",cat:"Grocery",price:549,mrp:699,rating:4.6,ratings:5410,emoji:"🌾",brand:"FarmFresh",badge:"",variants:["5kg","10kg"],desc:"Premium long-grain organic basmati rice, aged for aroma.",subscribable:true},
  {id:"p5",title:"Atomic Habits — Paperback",cat:"Books",price:299,mrp:599,rating:4.8,ratings:41200,emoji:"📘",brand:"Penguin",badge:"Best Seller",variants:["Paperback","Hardcover","Kindle"],desc:"An easy and proven way to build good habits and break bad ones.",subscribable:false},
  {id:"p6",title:"Vitamin C Face Serum, 30ml",cat:"Beauty",price:449,mrp:899,rating:4.2,ratings:6720,emoji:"🧴",brand:"GlowLab",badge:"",variants:["30ml","50ml"],desc:"Brightening face serum with 10% Vitamin C, reduces dark spots.",subscribable:true},
  {id:"p7",title:"Smartwatch with Heart Rate & SpO2 Monitor",cat:"Electronics",price:1999,mrp:4499,rating:4.0,ratings:9040,emoji:"⌚",brand:"PulseTech",badge:"Premium Choice",variants:["Black","Silver"],desc:"1.8 inch HD display, 7-day battery, 100+ sports modes.",subscribable:false},
  {id:"p8",title:"Women's Ethnic Anarkali Kurti",cat:"Fashion",price:899,mrp:1999,rating:4.4,ratings:2870,emoji:"👗",brand:"Meera Weaves",badge:"Premium",variants:["S","M","L","XL"],desc:"Rayon fabric Anarkali kurti with floral print, festive wear.",subscribable:false},
  {id:"p9",title:"LED Smart Bulb, WiFi Enabled (Pack of 2)",cat:"Home & Kitchen",price:599,mrp:1199,rating:4.3,ratings:4120,emoji:"💡",brand:"HomeCraft",badge:"",variants:["Pack of 2","Pack of 4"],desc:"16 million colours, works with voice assistants.",subscribable:false},
  {id:"p10",title:"Cold Pressed Extra Virgin Olive Oil, 1L",cat:"Grocery",price:749,mrp:999,rating:4.5,ratings:2980,emoji:"🫒",brand:"FarmFresh",badge:"",variants:["1L","2L"],desc:"First cold-press extra virgin olive oil, imported.",subscribable:true},
  {id:"p11",title:"Bluetooth Portable Speaker, 12W",cat:"Electronics",price:1299,mrp:2499,rating:4.1,ratings:5560,emoji:"🔊",brand:"SonicWave",badge:"Premium",variants:["Black","Red"],desc:"Deep bass, IPX7 waterproof, 10 hour playtime.",subscribable:false},
  {id:"p12",title:"Kids Story Book Set (10 Books)",cat:"Books",price:399,mrp:799,rating:4.7,ratings:1980,emoji:"📚",brand:"Penguin",badge:"",variants:["English","Hindi"],desc:"Illustrated bedtime story collection for ages 4-9.",subscribable:false},
];

const REVIEWS = {
  p1:[{name:"Rahul K.",stars:5,text:"Sound quality bahut acchi hai, battery bhi din bhar chalti hai."},
      {name:"Priya S.",stars:4,text:"Comfortable for long use, thoda heavy hai per ok."}],
  p3:[{name:"Anjali M.",stars:5,text:"Non-stick coating solid hai, roz use kar rahi hoon 3 mahine se."}],
};

/* ===================== STATE ===================== */
let state = {

/* ===================== CART OPS ===================== */
function addToCart(id, qty=1, variant=null){
  const existing = state.cart.find(c=>c.id===id && c.variant===variant);
  if(existing){ existing.qty += qty; } else { state.cart.push({id, qty, variant}); }
  toast("Cart mein add ho gaya");
  render();
}
function updateQty(id, variant, delta){
  const item = state.cart.find(c=>c.id===id && c.variant===variant);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) state.cart = state.cart.filter(c=>c!==item);
  render();
}
function removeFromCart(id, variant){
  state.cart = state.cart.filter(c=>!(c.id===id && c.variant===variant));
  render();
}
function cartTotal(){
  return state.cart.reduce((sum,c)=>{
    const p = findProduct(c.id); if(!p) return sum;
    return sum + p.price*c.qty;
  },0);
}
function couponDiscount(subtotal){
  if(!state.appliedCoupon) return 0;
  const c = COUPONS[state.appliedCoupon];
  if(!c) return 0;
  return c.type==='pct' ? Math.round(subtotal*c.value/100) : c.value;
}
function applyCoupon(code){
  code = code.trim().toUpperCase();
  if(!code){ return; }
  if(COUPONS[code]){ state.appliedCoupon = code; toast("Coupon apply ho gaya: " + code); }
  else { state.appliedCoupon = null; toast("Invalid coupon code"); }
  render();
}
function toggleWishlist(id){
  if(state.wishlist.includes(id)) state.wishlist = state.wishlist.filter(w=>w!==id);
  else { state.wishlist.push(id); toast("Wishlist mein add kiya"); }
  render();
}

        <div class="summary-row total"><span>Order total</span><span>${money(total-discount+delivery)}</span></div>
        <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="placeOrder()">Order place karein</button>
        <p style="font-size:.75rem;color:var(--muted);margin-top:8px;">Order place karke aap Hindustan Digital Market ke Terms & Conditions se sehmat hote hain.</p>
      </div>
    </div>
  </div>`;
    }
function selectAddress(id){ state.selectedAddress=id; render(); }
function selectPayment(m){ state.paymentMethod=m; render(); }
function addAddress(){
  const name=document.getElementById('na-name').value.trim();
  const phone=document.getElementById('na-phone').value.trim();
  const line=document.getElementById('na-line').value.trim();
  const city=document.getElementById('na-city').value.trim();
  const pin=document.getElementById('na-pin').value.trim();
  if(!name||!line||!city||!pin){ toast("Saari fields bharein"); return; }
  const id = Date.now();
  state.addresses.push({id,name,line,city,pin,phone});
  state.selectedAddress=id;
  toast("Address add ho gaya");
  render();
}
function placeOrder(){
  const total = cartTotal();
  const discount = couponDiscount(total);
  const delivery = total>499?0:49;
  const order = {
    id: "OD" + Math.floor(100000+Math.random()*899999),
    items: state.cart.map(c=>{const p=findProduct(c.id); return {title:p.title, qty:c.qty, price:p.price, emoji:p.emoji};}),
    total: total-discount+delivery,
    payment: state.paymentMethod,
    address: state.addresses.find(a=>a.id===state.selectedAddress),
    status:"Confirmed",
    date: new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})
  };
  state.orders.unshift(order);
  state.cart = []; state.appliedCoupon = null;
  toast("Order place ho gaya!");
  go('#/orders');
}

function OrdersPage(){
  if(state.orders.length===0){
    return `<div class="container"><div class="empty"><h3>Koi order nahi hai</h3><p>Aapke orders yahan dikhenge.</p><a class="btn btn-primary" href="#/listing/All" style="margin-top:14px;display:inline-block;">Shopping karein</a></div></div>`;
  }
  const steps = ["Confirmed","Packed","Shipped","Out for Delivery","Delivered"];
  return `
  <div class="container" style="padding-top:20px;">
    <div class="stall"><div class="section-head"><h2>Your Orders</h2></div></div>
    ${state.orders.map(o=>{
      const stepIndex = steps.indexOf(o.status);
      return `
      <div class="order-card">
        <div class="order-head">
          <span>Order ID: <strong style="color:var(--ink);">${o.id}</strong> · ${o.date}</span>
          <span>${money(o.total)} · ${o.payment}</span>
        </div>
        ${o.items.map(it=>`<div style="display:flex;gap:12px;align-items:center;padding:6px 0;">
          <div style="font-size:1.6rem;">${it.emoji}</div>
          <div style="flex:1;font-size:.88rem;">${it.title} × ${it.qty}</div>
          <div style="font-size:.88rem;">${money(it.price*it.qty)}</div>
        </div>`).join('')}
        <div class="timeline">
          ${steps.map((s,i)=>`<div class="tl-step ${i<=stepIndex?'done':''}"><div class="dot"></div>${s}</div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="advanceOrder('${o.id}')">Status update karein (demo)</button>
          <button class="btn btn-ghost btn-sm" onclick="toast('Invoice download ho raha hai')">Invoice</button>
          <button class="btn btn-ghost btn-sm" onclick="openReturnModal('${o.id}')">Return / Replace</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function advanceOrder(id){
  const steps = ["Confirmed","Packed","Shipped","Out for Delivery","Delivered"];
  const o = state.orders.find(x=>x.id===id);
  const i = steps.indexOf(o.status);
  if(i<steps.length-1) o.status = steps[i+1];
  render();
}

function WishlistPage(){
  const items = PRODUCTS.filter(p=>state.wishlist.includes(p.id));
  if(items.length===0) return `<div class="container"><div class="empty"><h3>Wishlist khaali hai</h3><p>Products ko ♡ karke yahan save karein.</p></div></div>`;
  return `<div class="container" style="padding-top:20px;"><div class="stall"><div class="section-head"><h2>Aapki Wishlist</h2></div>
  <div class="grid">${items.map(ProductCard).join('')}</div></div></div>`;
}

function DealsPage(){
  return `<div class="container" style="padding-top:20px;">
    <div class="stall"><div class="section-head"><h2>Aaj ke Deals</h2></div>
    <div class="grid">${PRODUCTS.map(ProductCard).join('')}</div></div>
  </div>`;
}

  return `

      <div class="section-head"><h2>Gift Cards</h2></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">

          <p style="font-size:.85rem;color:var(--muted);margin-top:12px;">Kisi bhi occasion ke liye — birthday, wedding ya bas ek surprise. Email se turant deliver hota hai.</p>
        </div>
        <div>
          <div class="field"><label>Amount chunein</label>
            <div class="chips">${denoms.map(d=>`<span class="chip" onclick="selectGiftDenom(this,${d})">₹${d}</span>`).join('')}</div>

        </div>

    </div>
    <div class="stall">

      <div style="display:flex;gap:10px;max-width:400px;">
        <input id="gcCode" placeholder="Gift card code daalein">

      </div>
      <p style="font-size:.85rem;color:var(--muted);margin-top:10px;">Aapka current balance: <strong>${money(state.giftCardBalance)}</strong></p>
    </div>
  </div>`;
}
function selectGiftDenom(el){ [...el.parentElement.children].forEach(c=>c.classList.remove('active')); el.classList.add('active'); }
function redeemGiftCard(){
  const code = document.getElementById('gcCode').value.trim();
  if(!code){ toast("Code daalein"); return; }
  state.giftCardBalance += 500;
  toast("₹500 balance mein add ho gaya");
  render();
}

  return `
  <div class="container" style="padding-top:20px;">
    <div class="listing">
      <div class="filters">
        <h4>Mera Account</h4>
        <label>👤 Profile</label>

        <label>⭐ Premium Membership</label>

      </div>
      <div>
        <div class="stall">
          <div class="section-head"><h2>Profile</h2></div>
          <div class="formgrid">
            <div class="field"><label>Naam</label><input value="Rohan Verma"></div>
            <div class="field"><label>Email</label><input value="rohan.verma@example.com"></div>
            <div class="field"><label>Phone</label><input value="+91 98765 43210"></div>
            <div class="field"><label>Language</label><select><option>Hindi</option><option>English</option></select></div>

          <button class="btn btn-primary btn-sm">Save Changes</button>

        <div class="stall">
          <div class="section-head"><h2>Saved Addresses</h2></div>
          ${state.addresses.map(a=>`<div class="addr-card"><strong>${a.name}</strong><br><span style="font-size:.85rem;color:var(--muted);">${a.line}, ${a.city} - ${a.pin}</span></div>`).join('')}
        </div>

          </div>

          <button class="btn btn-forest btn-sm">Premium lein — ₹299/maheena</button>

      </div>

}

function SellerPage(){
  const revenue = state.sellerProducts.reduce((s,p)=>s+p.price*3,0);
  return `
  <div class="container" style="padding-top:20px;">
    <div class="stall">
      <div class="section-head"><h2>Seller Dashboard</h2></div>
      <div class="statgrid">
        <div class="stat"><div class="num">${state.sellerProducts.length}</div><div class="lbl">Active Listings</div></div>
        <div class="stat"><div class="num">${state.sellerOrders.length}</div><div class="lbl">Pending Orders</div></div>
        <div class="stat"><div class="num">${money(revenue)}</div><div class="lbl">This Month's Sales</div></div>
        <div class="stat"><div class="num">4.6★</div><div class="lbl">Seller Rating</div></div>
      </div>
    </div>

    <div class="stall">
      <div class="tabs">
        <button class="active" onclick="switchSellerTab(this,'inv')">Inventory</button>
        <button onclick="switchSellerTab(this,'ord')">Orders</button>
        <button onclick="switchSellerTab(this,'ads')">Ads Campaigns</button>
        <button onclick="switchSellerTab(this,'add')">Add Product</button>
      </div>
      <div id="seller-inv">
        <table>
          <tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>
          ${state.sellerProducts.map(p=>`
          <tr>
            <td>${p.title}</td><td>${money(p.price)}</td><td>${p.stock}</td>
            <td><span class="pill ${p.stock>0?'delivered':'processing'}">${p.stock>0?'In Stock':'Out of Stock'}</span></td>
            <td><button class="btn btn-ghost btn-sm" onclick="toast('Listing edit ho rahi hai')">Edit</button></td>
          </tr>`).join('')}
        </table>
      </div>
      <div id="seller-ord" style="display:none;">
        <table>
          <tr><th>Order ID</th><th>Item</th><th>Qty</th><th>Status</th><th></th></tr>
          ${state.sellerOrders.map(o=>`
          <tr>
            <td>${o.id}</td><td>${o.item}</td><td>${o.qty}</td>
            <td><span class="pill ${o.status}">${o.status}</span></td>
            <td><button class="btn btn-ghost btn-sm" onclick="toast('Shipping label print ho raha hai')">Ship</button></td>
          </tr>`).join('')}
        </table>
      </div>
      <div id="seller-ads" style="display:none;">
        <table>
          <tr><th>Campaign</th><th>Budget</th><th>Spent</th><th>Status</th><th></th></tr>
          ${state.sellerCampaigns.map(a=>`
          <tr>
            <td>${a.name}</td><td>${money(a.budget)}</td><td>${money(a.spent)}</td>
            <td><span class="pill ${a.status}">${a.status}</span></td>
            <td><button class="btn btn-ghost btn-sm" onclick="pauseCampaign('${a.id}')">${a.status==='running'?'Pause':'Resume'}</button></td>
          </tr>`).join('')}
        </table>
        <div class="formgrid" style="margin-top:16px;">
          <div class="field"><label>Campaign Naam</label><input id="ad-name"></div>
          <div class="field"><label>Daily Budget (₹)</label><input id="ad-budget" type="number"></div>
          <div class="field"><label>Product</label><select id="ad-product">${state.sellerProducts.map(p=>`<option>${p.title}</option>`).join('')}</select></div>
          <div class="field"><label>Placement</label><select><option>Search Results (Sponsored)</option><option>Product Page</option><option>Homepage Banner</option></select></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addCampaign()">Campaign Launch Karein</button>
      </div>
      <div id="seller-add" style="display:none;">
        <div class="formgrid">
          <div class="field" style="grid-column:1/-1;"><label>Product Title</label><input id="sp-title"></div>
          <div class="field"><label>Category</label><select id="sp-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div class="field"><label>Price (₹)</label><input id="sp-price" type="number"></div>
          <div class="field"><label>Stock Quantity</label><input id="sp-stock" type="number"></div>
          <div class="field"><label>Fulfilment</label><select><option>Fulfilled by HDM</option><option>Self-ship</option></select></div>
          <div class="field" style="grid-column:1/-1;"><label>Description</label><textarea rows="3" id="sp-desc"></textarea></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addSellerProduct()">Listing publish karein</button>
      </div>
    </div>
  </div>`;
}
function switchSellerTab(btn,tab){
  [...btn.parentElement.children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['inv','ord','ads','add'].forEach(t=>document.getElementById('seller-'+t).style.display = t===tab?'block':'none');
}
function addSellerProduct(){
  const title = document.getElementById('sp-title').value.trim();
  const price = parseFloat(document.getElementById('sp-price').value);
  const stock = parseInt(document.getElementById('sp-stock').value);
  if(!title || !price){ toast("Title aur price bharein"); return; }
  state.sellerProducts.push({id:'sp'+Date.now(), title, price, stock:stock||0, status:'active'});
  toast("Product listing publish ho gayi");
  render();
}
function addCampaign(){
  const name = document.getElementById('ad-name').value.trim();
  const budget = parseFloat(document.getElementById('ad-budget').value);
  if(!name || !budget){ toast("Campaign naam aur budget bharein"); return; }
  state.sellerCampaigns.push({id:'AD-'+Date.now(), name, budget, spent:0, status:'running'});
  toast("Ad campaign launch ho gaya");
  render();
}
function pauseCampaign(id){
  const c = state.sellerCampaigns.find(x=>x.id===id);
  c.status = c.status==='running' ? 'paused' : 'running';
  render();
}

/* ===================== ROUTER ===================== */
function render(){
  const hash = location.hash || '#/home';
  const parts = hash.replace('#/','').split('/');
  let body = '';
  switch(parts[0]){
    case 'home': body = HomePage(); break;
    case 'listing': body = ListingPage(parts[1]); break;
    case 'search': body = SearchPage(); break;
    case 'product': body = ProductPage(parts[1]); break;
    case 'cart': body = CartPage(); break;
    case 'checkout': body = CheckoutPage(); break;
    case 'orders': body = OrdersPage(); break;
    case 'wishlist': body = WishlistPage(); break;
    case 'deals': body = DealsPage(); break;
    case 'giftcards': body = GiftCardsPage(); break;
    case 'account': body = AccountPage(); break;
    case 'seller': body = SellerPage(); break;
    default: body = HomePage();
  }
  document.getElementById('app').innerHTML = Header() + body + `
    <footer>
      <div class="container">
        <div><h5>Grahak Sevа</h5><p>Order Track karein</p><p>Return & Refund</p><p>Help Center</p></div>
        <div><h5>HDM par Bechna</h5><p onclick="go('#/seller')">Seller ban jaayein</p><p>Apna brand advertise karein</p><p>Fulfilment by HDM</p></div>
        <div><h5>Payments</h5><p>UPI, Cards, Net Banking</p><p>Cash on Delivery</p><p>EMI options</p><p>Gift Cards</p></div>
        <div><h5>Hindustan Digital Market</h5><p>Hamare baare mein</p><p>Careers</p><p>Sustainability</p></div>
      </div>
    </footer>`;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
