<title>Hindustan Digital Market — Complete Platform</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:#f5f0e8;color:#1a1714;transition:background .3s,color .3s;
    padding:0;
  }
  body.dark{background:#1a1714;color:#e8e0d4;}
  body.dark .stall,body.dark .pcard,body.dark .eco-card,body.dark .cart-summary,body.dark .order-card,body.dark .modal{background:#2a2622;border-color:#3d3832;color:#e8e0d4;}
  body.dark input,body.dark select,body.dark textarea{background:#3d3832;color:#e8e0d4;border-color:#5a5048;}
  body.dark .subnav{background:#0f0d0a;}
  body.dark .topbar{background:#0f0d0a;}
  body.dark .stat{background:#2a2622;border-color:#3d3832;}
  a{color:inherit;text-decoration:none;}
  button{cursor:pointer;font-family:inherit;background:transparent;border:none;}
  .container{max-width:1140px;margin:0 auto;padding:0 16px;}
  .topbar{background:#1a1714;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;border-bottom:2px solid #c9a227;}
  .logo{font-size:1.2rem;font-weight:700;color:#c9a227;white-space:nowrap;}
  .searchwrap{flex:1;display:flex;max-width:400px;min-width:150px;}
  .searchwrap input{flex:1;padding:8px 12px;border:none;border-radius:4px 0 0 4px;background:#fff;color:#1a1714;}
  .searchwrap button{background:#c9a227;border:none;padding:8px 16px;border-radius:0 4px 4px 0;font-weight:600;color:#1a1714;}
  .navicons{display:flex;gap:14px;font-size:.85rem;flex-wrap:wrap;align-items:center;}
  .navicons a,.navicons button{color:#fff;display:flex;align-items:center;gap:3px;}
  .badge{background:#6b1e2b;color:#fff;padding:0 6px;border-radius:10px;font-size:.65rem;margin-left:3px;}
  .subnav{background:#221e1a;display:flex;gap:14px;padding:8px 16px;overflow-x:auto;font-size:.85rem;border-bottom:1px solid #3d3832;}
  .subnav a{color:#d9d2be;white-space:nowrap;}
  .subnav a:hover{color:#c9a227;}
  .btn{display:inline-block;padding:8px 18px;border-radius:4px;font-weight:600;font-size:.85rem;border:1px solid transparent;transition:all .2s;}
  .btn-primary{background:#c9a227;color:#1a1714;}
  .btn-primary:hover{background:#b8921f;}
  .btn-outline{background:transparent;border-color:#c9a227;color:#c9a227;}
  .btn-outline:hover{background:#c9a227;color:#1a1714;}
  .btn-forest{background:#1f4b3f;color:#fff;}
  .btn-forest:hover{background#1a3d33;}
  .btn-danger{background:#b91c1c;color:#fff;}
  .btn-sm{padding:4px 12px;font-size:.75rem;}
  .btn-block{width:100%;text-align:center;}
  .stall{border:1px solid #ddd;background:#fff;padding:18px;margin-bottom:16px;border-radius:4px;}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1a1714;padding-bottom:6px;margin-bottom:12px;}
  .section-head h2{font-size:1.2rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .pcard{border:1px solid #ddd;background:#fff;padding:12px;border-radius:4px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s;}
  .pcard:hover{border-color:#c9a227;}
  .pcard .thumb{height:100px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:2.6rem;border-radius:4px;}
  .pcard h3{font-size:.9rem;font-weight:500;margin:4px 0;min-height:2.4em;}
  .price{font-weight:700;font-size:1rem;}
  .price .mrp{text-decoration:line-through;color:#888;font-weight:400;font-size:.8rem;margin-left:6px;}
  .price .off{color:#1f4b3f;font-size:.75rem;margin-left:6px;}
  .rating{font-size:.75rem;color:#888;}
  .tag{display:inline-block;background:#6b1e2b;color:#fff;padding:1px 8px;border-radius:3px;font-size:.65rem;font-weight:600;}
  .tag.gold{background:#c9a227;color:#1a1714;}
  .tag.flash{background:#dc2626;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .eco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .eco-card{border:1px solid #ddd;background:#fff;padding:10px;border-radius:4px;cursor:pointer;transition:border-color .15s;}
  .eco-card:hover{border-color:#c9a227;}
  .eco-card h4{font-size:.9rem;display:flex;justify-content:space-between;align-items:center;}
  .eco-card .badge{font-size:.6rem;padding:2px 8px;border-radius:12px;background:#e5e7eb;color:#1f2937;position:static;}
  .badge-live{background:#d1fae5;color:#065f46;}
  .badge-mock{background:#fef3c7;color:#92400e;}
  .badge-backend{background:#dbeafe;color:#1e40af;}
  .badge-aws{background:#f3e8ff;color:#6b21a8;}
  .badge-planned{background:#f3f4f6;color:#4b5563;}
  .eco-search{width:100%;max-width:320px;padding:8px 12px;border:1px solid #ddd;border-radius:4px;margin-bottom:12px;background:#fff;color:#1a1714;}
  .eco-cat{margin-bottom:12px;}
  .cart-row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px 0;}
  .cart-row .thumb{font-size:2rem;}
  .cart-summary{border:1px solid #ddd;background:#fff;padding:18px;}
  .summary-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem;}
  .summary-row.total{border-top:1px solid #ddd;margin-top:6px;padding-top:10px;font-weight:700;}
  .qty{display:inline-flex;border:1px solid #ddd;border-radius:4px;}
  .qty button{background:transparent;width:28px;height:28px;font-size:1rem;border:none;}
  .qty span{padding:0 10px;display:flex;align-items:center;}
  .order-card{border:1px solid #ddd;background:#fff;padding:16px;margin-bottom:12px;border-radius:4px;}
  .order-head{display:flex;justify-content:space-between;font-size:.85rem;color:#888;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:10px;}
  .timeline{display:flex;gap:0;margin-top:10px;overflow-x:auto;}
  .tl-step{flex:1;text-align:center;font-size:.7rem;color:#888;min-width:60px;position:relative;}
  .tl-step .dot{width:10px;height:10px;border-radius:50%;background:#ddd;margin:0 auto 4px;}
  .tl-step.done .dot{background:#1f4b3f;}
  .tl-step.done{color:#1f4b3f;font-weight:600;}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px;}
  .stat{border:1px solid #ddd;background:#fff;padding:12px;border-radius:4px;}
  .stat .num{font-size:1.5rem;font-weight:700;}
  .stat .lbl{font-size:.75rem;color:#888;}
  .tabs{display:flex;gap:4px;border-bottom:2px solid #1a1714;margin-bottom:12px;flex-wrap:wrap;}
  .tabs button{padding:6px 14px;font-weight:600;font-size:.85rem;color:#888;border:none;background:transparent;}
  .tabs button.active{color:#1a1714;border-bottom:3px solid #c9a227;margin-bottom:-2px;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;}
  th{color:#888;font-weight:600;font-size:.75rem;}
  .pill{padding:2px 10px;border-radius:12px;font-size:.7rem;font-weight:600;}
  .pill.active{background:#d1fae5;color:#065f46;}
  .pill.processing{background:#fef3c7;color:#92400e;}
  .pill.shipped{background:#dbeafe;color:#1e40af;}
  .pill.delivered{background:#d1fae5;color:#065f46;}
  .pill.cancelled{background#fde8e8;color#b91c1c;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:90;}
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff;padding:24px;border-radius:6px;max-width:92vw;width:420px;max-height:90vh;overflow-y:auto;}
  .modal h3{margin-bottom:10px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1714;color:#c9a227;padding:10px 24px;border-radius:4px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;border:1px solid #c9a227;}
  .toast.show{opacity:1;}
  .empty{text-align:center;padding:40px 20px;color:#888;}
  .chip{display:inline-block;border:1px solid #ddd;padding:3px 14px;border-radius:20px;font-size:.8rem;background:#fff;margin:3px;cursor:pointer;}
  .chip.active{background:#1a1714;color:#fff;border-color:#1a1714;}
  input,select,textarea{font-family:inherit;padding:6px 10px;border:1px solid #ddd;border-radius:4px;width:100%;font-size:.9rem;background:#fff;color:#1a1714;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:.8rem;color:#888;margin-bottom:3px;}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  footer{background:#1a1714;color:#999;padding:24px;margin-top:30px;text-align:center;font-size:.85rem;}
  .font-controls{display:flex;gap:4px;align-items:center;}
  .font-controls button{background:#3d3832;color:#fff;border:none;padding:2px 10px;border-radius:3px;font-size:.7rem;}
  @media(max-width:600px){.topbar{flex-direction:column;align-items:stretch;}.searchwrap{max-width:100%;}.navicons{justify-content:center;}.subnav{flex-wrap:nowrap;}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}.eco-grid{grid-template-columns:1fr;}}
</style>
</head>

<!-- ===== MODALS ===== -->
<div class="modal-backdrop" id="returnModal"><div class="modal"><h3>Return / Replace</h3><div class="field"><label>Reason</label><select id="retReason"><option>Damaged</option><option>Wrong item</option><option>Size issue</option></select></div><div class="field"><label>Comments</label><textarea rows="2" id="retComment"></textarea></div><button class="btn btn-primary btn-sm" onclick="submitReturn()">Submit</button> <button class="btn btn-outline btn-sm" onclick="closeModal('returnModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="claimModal"><div class="modal"><h3>A-to-Z Guarantee</h3><div class="field"><label>Order ID</label><input id="claimOrder" placeholder="OD123456"></div><div class="field"><label>Reason</label><select id="claimReason"><option>Item not received</option><option>Defective</option><option>Not as described</option></select></div><div class="field"><label>Description</label><textarea rows="3" id="claimDesc"></textarea></div><button class="btn btn-primary btn-sm" onclick="submitClaim()">Submit</button> <button class="btn btn-outline btn-sm" onclick="closeModal('claimModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="refundModal"><div class="modal"><h3>Partial Refund</h3><div class="field"><label>Order ID</label><input id="refundOrder" placeholder="OD123456"></div><div class="field"><label>Amount (₹)</label><input id="refundAmount" type="number" placeholder="0"></div><div class="field"><label>Reason</label><select id="refundReason"><option>Damaged</option><option>Wrong item</option></select></div><button class="btn btn-primary btn-sm" onclick="submitPartialRefund()">Process</button> <button class="btn btn-outline btn-sm" onclick="closeModal('refundModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="otpModal"><div class="modal"><h3>🔐 OTP</h3><p style="font-size:.85rem;color:#888;">Use 123456</p><div class="field"><input id="otpInput" placeholder="123456" maxlength="6" style="font-size:1.4rem;text-align:center;"></div><button class="btn btn-primary btn-sm" onclick="verifyOTP()">Verify</button> <button class="btn btn-outline btn-sm" onclick="closeModal('otpModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="qaModal"><div class="modal"><h3>Ask Question</h3><div class="field"><label>Your Question</label><textarea rows="3" id="qaText"></textarea></div><button class="btn btn-primary btn-sm" onclick="submitQuestion()">Submit</button> <button class="btn btn-outline btn-sm" onclick="closeModal('qaModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="reviewModal"><div class="modal"><h3>Write Review</h3><div class="field"><label>Rating</label><div id="starSelector" style="font-size:1.6rem;display:flex;gap:4px;cursor:pointer;">★☆★☆★</div></div><div class="field"><label>Review</label><textarea rows="3" id="reviewText"></textarea></div><button class="btn btn-primary btn-sm" onclick="submitReview()">Submit</button> <button class="btn btn-outline btn-sm" onclick="closeModal('reviewModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="bulkUploadModal"><div class="modal"><h3>Bulk Upload</h3><div class="field"><label>CSV File</label><input type="file" accept=".csv" id="csvFile"></div><button class="btn btn-primary btn-sm" onclick="previewCSV()">Preview</button> <button class="btn btn-forest btn-sm" onclick="importCSV()">Import</button> <button class="btn btn-outline btn-sm" onclick="closeModal('bulkUploadModal')">Cancel</button><div id="csvPreview" style="margin-top:10px;max-height:150px;overflow-y:auto;"></div></div></div>
<div class="modal-backdrop" id="sellerOnboardModal"><div class="modal"><h3>Seller Onboard</h3><div class="field"><label>Business Name</label><input id="sbName"></div><div class="field"><label>GST</label><input id="sbGst"></div><div class="field"><label>PAN</label><input id="sbPan"></div><div class="field"><label>Bank</label><input id="sbBank"></div><button class="btn btn-primary btn-sm" onclick="submitSellerOnboard()">Submit</button> <button class="btn btn-outline btn-sm" onclick="closeModal('sellerOnboardModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="couponModal"><div class="modal"><h3>Create Coupon</h3><div class="field"><label>Code</label><input id="cpCode"></div><div class="field"><label>Discount %</label><input id="cpValue" type="number"></div><div class="field"><label>Expiry</label><input id="cpExpiry" type="datetime-local"></div><button class="btn btn-primary btn-sm" onclick="createCoupon()">Create</button> <button class="btn btn-outline btn-sm" onclick="closeModal('couponModal')">Cancel</button></div></div>
<div class="modal-backdrop" id="compareModal"><div class="modal" style="width:600px;max-width:92vw;"><h3>Compare</h3><div id="compareContent"></div><button class="btn btn-outline btn-sm" onclick="closeModal('compareModal')">Close</button></div></div>
<div class="modal-backdrop" id="addressModal"><div class="modal"><h3>Add Address</h3><div class="field"><label>Name</label><input id="addrName"></div><div class="field"><label>Address</label><input id="addrLine"></div><div class="field"><label>City</label><input id="addrCity"></div><div class="field"><label>Pincode</label><input id="addrPin"></div><div class="field"><label>Phone</label><input id="addrPhone"></div><button class="btn btn-primary btn-sm" onclick="addAddress()">Save</button> <button class="btn btn-outline btn-sm" onclick="closeModal('addressModal')">Cancel</button></div></div>

function loadState() {
  try {
    const saved = localStorage.getItem('hdm_state');
    if(saved) {
      const parsed = JSON.parse(saved);
      // Merge with defaults
      for(let key in defaultState) {
        if(parsed[key] === undefined) parsed[key] = defaultState[key];
      }
      return parsed;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(defaultState));
}

function saveState() {
  localStorage.setItem('hdm_state', JSON.stringify(state));
}

function money(n){ return "₹" + Math.round(n).toLocaleString("en-IN"); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2200);
}
function findProduct(id){ return PRODUCTS.find(p=>p.id===id) || state.sellerProducts.find(p=>p.id===id); }

// ========== CORE ACTIONS ==========
function addToCart(id,qty=1,variant=null){
  const existing = state.cart.find(c=>c.id===id && c.variant===variant);
  if(existing) existing.qty += qty;
  else state.cart.push({id,qty,variant});
  toast("Added to cart!");
  saveState(); render();
}
function updateQty(id,variant,delta){
  const item = state.cart.find(c=>c.id===id && c.variant===variant);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) state.cart = state.cart.filter(c=>c!==item);
  saveState(); render();
}
function toggleWishlist(id){
  if(state.wishlist.includes(id)) state.wishlist = state.wishlist.filter(w=>w!==id);
  else { state.wishlist.push(id); toast("Wishlist added!"); }
  saveState(); render();
}
function trackRecentlyViewed(id){
  state.recentlyViewed = state.recentlyViewed.filter(x=>x!==id);
  state.recentlyViewed.unshift(id);
  if(state.recentlyViewed.length>20) state.recentlyViewed.pop();
  saveState();
}
function cartTotal(){ return state.cart.reduce((s,c)=>s + (findProduct(c.id)?.price||0)*c.qty, 0); }

function placeOrder(){
  if(state.cart.length===0) return toast("Cart empty!");
  const total = cartTotal();
  const order = {
    id: "OD"+Math.floor(100000+Math.random()*899999),
    items: state.cart.map(c=>{const p=findProduct(c.id); return {title:p.title,qty:c.qty,price:p.price,emoji:p.emoji};}),
    total: total,
    payment: state.paymentMethod,
    address: state.addresses.find(a=>a.id===state.selectedAddress),
    status: "Confirmed",
    date: new Date().toLocaleDateString('en-IN')
  };
  state.orders.unshift(order);
  state.cart = [];
  toast("🎉 Order placed successfully!");
  saveState(); go('#/orders');
}

function advanceOrder(id){
  const steps = ["Confirmed","Packed","Shipped","Delivered"];
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  const i = steps.indexOf(o.status);
  if(i < steps.length-1) o.status = steps[i+1];
  saveState(); render();
}

function cancelOrder(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o || o.status==='Delivered' || o.status==='Cancelled') return;
  o.status = 'Cancelled';
  toast("Order cancelled.");
  saveState(); render();
}

function buyAgain(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return toast("Order not found");
  order.items.forEach(item => {
    const p = PRODUCTS.find(x=>x.title===item.title);
    if(p) addToCart(p.id, item.qty, null);
  });
  toast("Items re-added!");
}

    if(actionStr.startsWith('go')) {
      eval(actionStr);
    } else if(actionStr.startsWith('openModal')) {

      toggle2FA();
    } else {
      eval(actionStr);

    toast("⚡ Feature: " + actionStr);

}

function ProductCard(p){
  const inWish = state.wishlist.includes(p.id);
  const off = Math.round((1 - p.price/p.mrp)*100);
  const isFlash = state.flashDeals?.includes(p.id);
  return `
  <div class="pcard" style="border-color:${isFlash?'#c9a227':'#ddd'};">
    ${p.badge?`<span class="tag ${p.badge==='Premium'?'gold':''}">${p.badge}</span>`:''}
    ${isFlash?`<span class="tag flash">⚡ Flash</span>`:''}
    <a href="#/product/${p.id}"><div class="thumb">${p.emoji}</div></a>
    <a href="#/product/${p.id}" style="text-decoration:none;color:inherit;"><h3>${p.title}</h3></a>
    <div class="rating">${p.rating}★ (${p.ratings.toLocaleString()})</div>
    <div class="price">${money(p.price)} <span class="mrp">${money(p.mrp)}</span><span class="off">${off}% off</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="addToCart('${p.id}',1,null)">Add</button>
      <button class="btn btn-outline btn-sm" onclick="toggleWishlist('${p.id}')">${inWish?'♥':'♡'}</button>
      <button class="btn btn-outline btn-sm" onclick="toast('🔔 Alert set for ${p.price}')">🔔</button>
    </div>
  </div>`;
}

    ${recent.length?`<div class="stall"><div class="section-head"><h2>👁️ Recently Viewed</h2></div><div class="grid">${recent.slice(0,4).map(ProductCard).join('')}</div></div>`:''}

function ListingPage(cat){

  let list = cat==='All' ? [...PRODUCTS] : PRODUCTS.filter(p=>p.cat===cat);
  return `
  <div class="container" style="padding-top:16px;">
    <div style="display:grid;grid-template-columns:160px 1fr;gap:20px;">
      <div style="border:1px solid #ddd;background:#fff;padding:12px;position:sticky;top:80px;border-radius:4px;">
        <h4>Categories</h4>
        ${['All','Electronics','Fashion','Home','Grocery','Books','Beauty'].map(c =>
          `<label style="display:block;font-size:.85rem;padding:4px 0;"><input type="radio" name="cat" ${c===cat?'checked':''} onclick="go('#/listing/${encodeURIComponent(c)}')"> ${c}</label>`
        ).join('')}
        <hr style="margin:8px 0;">
        <button class="btn btn-outline btn-sm btn-block" onclick="openModal('addressModal')">+ Address</button>

            <option value="lh">Price: Low-High</option>
            <option value="hl">Price: High-Low</option>

        </div>
        <div class="grid" id="listing-grid">${list.map(ProductCard).join('')}</div>
      </div>

}
function sortListing(mode){
  let cat = location.hash.split('/')[2] ? decodeURIComponent(location.hash.split('/')[2]) : 'All';
  let list = cat==='All' ? [...PRODUCTS] : PRODUCTS.filter(p=>p.cat===cat);
  if(mode==='lh') list.sort((a,b)=>a.price-b.price);
  if(mode==='hl') list.sort((a,b)=>b.price-a.price);
  document.getElementById('listing-grid').innerHTML = list.map(ProductCard).join('');
}
function SearchPage(){
  const q = state.searchQuery.toLowerCase();
  const list = PRODUCTS.filter(p=>p.title.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q));
  return `<div class="container"><div class="stall"><h2>"${state.searchQuery}" (${list.length})</h2>${list.length?`<div class="grid">${list.map(ProductCard).join('')}</div>`:'<div class="empty">No results</div>'}</div></div>`;
}
function ProductPage(id){
  const p = findProduct(id); if(!p) return `<div class="container empty"><h3>Not found</h3></div>`;
  trackRecentlyViewed(id);
  const revs = REVIEWS[id] || [];
  const qs = QUESTIONS[id] || [];
  const qtyKey = 'qty_'+id; if(!window[qtyKey]) window[qtyKey]=1;
  return `
  <div class="container" style="padding-top:16px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;">
      <div><div style="height:280px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:4rem;border:1px solid #ddd;border-radius:4px;">${p.emoji}</div></div>
      <div>
        <h1>${p.title}</h1>
        <div style="color:#1f4b3f;">${p.brand}</div>
        <div style="font-size:1.6rem;font-weight:700;">${money(p.price)} <span style="font-size:1rem;text-decoration:line-through;color:#888;">${money(p.mrp)}</span></div>
        ${p.variants?`<div><strong>Variant:</strong> ${p.variants.map(v=>`<span class="chip" onclick="selectVariant(this)">${v}</span>`).join('')}</div>`:''}
        <div><strong>Qty:</strong> <div class="qty"><button onclick="if(window['${qtyKey}']>1){window['${qtyKey}']--;document.getElementById('qtydisp').textContent=window['${qtyKey}'];}">−</button><span id="qtydisp">${window[qtyKey]}</span><button onclick="window['${qtyKey}']++;document.getElementById('qtydisp').textContent=window['${qtyKey}'];">+</button></div></div>
        <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="addToCart('${p.id}',window['${qtyKey}'],getSelectedVariant())">Add</button>
          <button class="btn btn-outline" onclick="addToCart('${p.id}',window['${qtyKey}'],getSelectedVariant());go('#/checkout')">Buy Now</button>
          <button class="btn btn-outline" onclick="toggleWishlist('${p.id}')">${state.wishlist.includes(p.id)?'♥':'♡'}</button>
        </div>
        <div style="border:1px solid #c9a227;background:#fbf6e8;padding:10px;">💳 EMI: ${money(p.price/3)}/month</div>
        <div style="border:1px solid #ddd;padding:10px;margin-top:8px;"><strong>Delivery:</strong> <select>${getDeliverySlots().map(d=>`<option>${d.label} ${d.slots[0]}</option>`).join('')}</select></div>

    </div>
    <div class="stall"><h3>Reviews</h3>${revs.map(r=>`<div><strong>${r.name}</strong> ${'★'.repeat(r.stars)}<p>${r.text}</p></div>`).join('')}<button class="btn btn-outline btn-sm" onclick="openModal('reviewModal')">+ Write</button></div>
    <div class="stall"><h3>Q&A</h3>${qs.map(q=>`<div><strong>${q.user}</strong>: ${q.text} ${q.answer?`<span style="color:green;">✓ ${q.answer}</span>`:''}</div>`).join('')}<button class="btn btn-outline btn-sm" onclick="openModal('qaModal')">+ Ask</button></div>
  </div>`;
}
function selectVariant(el){ [...el.parentElement.children].forEach(c=>c.classList.remove('active')); el.classList.add('active'); }
function getSelectedVariant(){ const a = document.querySelector('.variant-row .active'); return a?a.textContent:null; }
function getDeliverySlots(){
  const slots = []; const today = new Date();
  for(let i=0;i<5;i++){ const d = new Date(today); d.setDate(d.getDate()+i); slots.push({ label: d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}), slots: ['9-11 AM','11-1 PM','3-5 PM'] }); }
  return slots;
}

function CartPage(){
  if(!state.cart.length) return `<div class="container"><div class="empty"><h3>Cart empty</h3><a href="#/listing/All" class="btn btn-primary">Shop now</a></div></div>`;
  const total = cartTotal();
  return `<div class="container"><div class="stall"><h2>Cart</h2>${state.cart.map(c=>{const p=findProduct(c.id); return `<div class="cart-row"><div class="thumb">${p.emoji}</div><div><strong>${p.title}</strong><div class="qty"><button onclick="updateQty('${c.id}',${c.variant?`'${c.variant}'`:null},-1)">−</button><span>${c.qty}</span><button onclick="updateQty('${c.id}',${c.variant?`'${c.variant}'`:null},1)">+</button></div></div><div style="font-weight:700;">${money(p.price*c.qty)}</div></div>`}).join('')}</div><div class="cart-summary"><h3>Total: ${money(total)}</h3><button class="btn btn-primary btn-block" onclick="go('#/checkout')">Checkout</button></div></div>`;

  return `<div class="container"><div class="stall"><h2>Wishlist</h2><div class="grid">${items.map(ProductCard).join('')}</div></div></div>`;

function DealsPage(){
  return `<div class="container"><div class="stall"><h2>Deals</h2><div class="grid">${PRODUCTS.map(ProductCard).join('')}</div></div></div>`;
}
function GiftCardsPage(){
  return `<div class="container"><div class="stall"><h2>Gift Cards</h2><div style="background:linear-gradient(135deg,#6b1e2b,#3a0f17);color:#c9a227;padding:30px;border-radius:6px;text-align:center;font-size:1.4rem;">🎁 HDM Gift Card</div><div style="margin-top:12px;"><input id="gcCode" placeholder="Enter code" style="width:200px;"><button class="btn btn-primary" onclick="state.giftCardBalance+=500;toast('₹500 added!');saveState();render();">Redeem</button><p>Balance: ${money(state.giftCardBalance)}</p></div></div></div>`;

function AccountPage(){
  return `<div class="container"><div class="stall"><h2>My Account</h2><label><input type="checkbox" ${state.twoFAEnabled?'checked':''} onchange="toggle2FA()"> 2FA</label><label><input type="checkbox" ${state.isBusiness?'checked':''} onchange="toggleBusiness()"> B2B</label><button class="btn btn-outline btn-sm" onclick="openModal('otpModal')">OTP</button><button class="btn btn-outline btn-sm" onclick="openModal('addressModal')">+ Address</button><div><h4>Payment Methods</h4>${state.paymentMethods.map(m=>`<div>${m.type}: ${m.last4||m.id}</div>`).join('')}</div><div><h4>Security Logs</h4>${state.securityLogs.map(l=>`<div style="font-size:.85rem;">${l.device} ${l.time}</div>`).join('')}</div></div></div>`;

function SellerPage(){
  const revenue = state.sellerProducts.reduce((s,p)=>s+p.price*3,0);

function SellerStorefrontPage(){
  return `<div class="container"><div class="stall"><h2>Seller Storefront</h2><div class="grid">${state.sellerProducts.map(p=>`<div class="pcard"><div class="thumb">🪴</div><h3>${p.title}</h3><div class="price">${money(p.price)}</div></div>`).join('')}</div></div></div>`;
}

function openCompare(ids){
  const products = ids.map(id=>findProduct(id)).filter(Boolean);
  if(products.length<2) return toast("Select 2+ products");
  let html = `<table style="width:100%;"><tr><th>Feature</th>${products.map(p=>`<th>${p.title.slice(0,15)}</th>`).join('')}</tr>`;
  html += `<tr><td>Price</td>${products.map(p=>`<td>${money(p.price)}</td>`).join('')}</tr>`;
  html += `<tr><td>Rating</td>${products.map(p=>`<td>${p.rating}★</td>`).join('')}</tr>`;
  html += `</table>`;
  document.getElementById('compareContent').innerHTML = html;
  openModal('compareModal');
}

// ========== ECOSYSTEM PAGE ==========
function EcosystemPage(){
  const cats = [...new Set(FEATURES_FULL.map(f=>f.cat))];
  let html = `<div class="container" style="padding-top:16px;">
    <div class="stall"><div class="section-head"><h2>📋 Complete 500+ Feature Ecosystem</h2>
    <span style="font-size:.8rem;color:#888;">Click any feature to activate it</span></div>
    <input class="eco-search" id="ecoSearch" placeholder="Search features..." oninput="filterEco()">
    <div id="ecoContainer">`;
  cats.forEach(cat => {
    const items = FEATURES_FULL.filter(f=>f.cat===cat);
    html += `<div class="eco-cat" data-cat="${cat}"><h3 style="margin:16px 0 8px;border-bottom:1px solid #ddd;">${cat} (${items.length})</h3><div class="eco-grid">`;
    items.forEach(f => {
      const badgeMap = { live:'✅ Live', mock:'🧪 Mock', backend:'⚙️ Backend', aws:'☁️ AWS', planned:'📋 Planned' };
      const clsMap = { live:'badge-live', mock:'badge-mock', backend:'badge-backend', aws:'badge-aws', planned:'badge-planned' };
      html += `<div class="eco-card" onclick="handleFeatureAction('${f.action || 'toast("'+f.name+'")'}')"><h4><span>${f.name}</span><span class="badge ${clsMap[f.status]||'badge-planned'}">${badgeMap[f.status]||f.status}</span></h4><p style="font-size:.75rem;color:#888;">${f.sub}</p></div>`;
    });
    html += `</div></div>`;
  });
  html += `</div></div></div>`;
  return html;
}
function filterEco(){
  const q = document.getElementById('ecoSearch').value.toLowerCase();
  document.querySelectorAll('.eco-card').forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q) ? 'block' : 'none';
  });
  document.querySelectorAll('.eco-cat').forEach(cat => {
    const visible = [...cat.querySelectorAll('.eco-card')].some(el => el.style.display !== 'none');
    cat.style.display = visible ? 'block' : 'none';
  });
}

// ========== RENDER ==========
function render(){
  const hash = location.hash || '#/home';
  const parts = hash.replace('#/','').split('/');
  let body = '';
  switch(parts[0]){
    case 'home': body = HomePage(); break;
    case 'listing': body = ListingPage(parts[1]); break;
    case 'search': body = SearchPage(); break;
    case 'product': body = ProductPage(parts[1]); break;
    case 'cart': body = CartPage(); break;
    case 'checkout': body = CheckoutPage(); break;
    case 'orders': body = OrdersPage(); break;
    case 'wishlist': body = WishlistPage(); break;
    case 'deals': body = DealsPage(); break;
    case 'giftcards': body = GiftCardsPage(); break;
    case 'account': body = AccountPage(); break;
    case 'seller': body = SellerPage(); break;
    case 'seller-storefront': body = SellerStorefrontPage(); break;
    case 'ecosystem': body = EcosystemPage(); break;
    default: body = HomePage();
  }
  document.getElementById('app').innerHTML = Header() + body + `
    <footer>
      <p>© 2026 Hindustan Digital Market — ${FEATURES_FULL.length}+ Features Live.</p>
      <p style="font-size:.8rem;color:#666;">Made in India. Ready for 10/09/2026 launch.</p>
    </footer>`;
  if(state.darkMode) document.body.classList.add('dark');
  else document.body.classList.remove('dark');
  window.scrollTo(0,0);
}

// ========== INIT ==========
window.addEventListener('hashchange', render);
render();
console.log("✅ Hindustan Digital Market Ready with", FEATURES_FULL.length, "features.");
</script>
